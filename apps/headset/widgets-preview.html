<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Widgets preview</title>
<style>
  body { margin: 0; background: #edf2f6; color: #0f1117; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  canvas.pixelated { image-rendering: pixelated; }
  #controls { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
  #controls .group { display: flex; gap: 4px; padding-right: 10px; }
  button { background: #fff; color: #0f1117; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(14, 42, 82, 0.16), 0 1px 2px rgba(15, 17, 23, 0.06); font: inherit; }
  button[aria-pressed='true'] { background: #0f1117; color: #fff; }
  button:focus-visible { outline: 3px solid #0f1117; outline-offset: 2px; }
  #captions { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .caption { position: absolute; color: #5b6472; font-weight: 500; white-space: nowrap; }
  .caption.light { color: #edf0f5; }
  #status { position: absolute; left: 12px; bottom: 10px; font-variant-numeric: tabular-nums; z-index: 2; color: #5b6472; }
</style>
</head>
<body>
<div id="controls"></div>
<div id="captions"></div>
<div id="status"></div>
<script type="module" src="/src/widgets-preview/main.ts"></script>
</body>
</html>
