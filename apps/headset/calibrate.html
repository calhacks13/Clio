<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clio Calibrate</title>
    <style>
      :root {
        --bg: #0b1016;
        --surface: #151c24;
        --text: #f2f5f7;
        --muted: #9aa7b2;
        --accent: #4fe3ff;
        --on-accent: #04121a;
        --secondary: #26313c;
        --disabled: #3a4651;
        --on-disabled: #9aa7b2;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        font: 500 18px system-ui, sans-serif;
      }
      #xr-canvas {
        position: fixed;
        inset: 0;
      }
      #home {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        width: min(420px, calc(100vw - 32px));
      }
      #home[hidden],
      #saved[hidden] {
        display: none;
      }
      #saved {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        column-gap: 16px;
        row-gap: 6px;
        padding: 16px 20px;
        border-radius: 12px;
        background: var(--surface);
      }
      #saved .k {
        color: var(--muted);
      }
      #saved .v {
        display: flex;
        flex-wrap: wrap;
        column-gap: 12px;
        font-variant-numeric: tabular-nums;
      }
      button {
        border: 0;
        border-radius: 12px;
        font: 600 20px system-ui, sans-serif;
      }
      #clear {
        grid-column: 3;
        grid-row: 1 / span 2;
        padding: 10px 18px;
        background: var(--secondary);
        color: var(--text);
        font-size: 16px;
      }
      #enter {
        padding: 18px 40px;
        background: var(--accent);
        color: var(--on-accent);
      }
      #enter:disabled {
        background: var(--disabled);
        color: var(--on-disabled);
      }
    </style>
  </head>
  <body>
    <div id="home">
      <section id="saved" hidden>
        <span class="k">Camera</span>
        <span class="v" id="saved-offset"></span>
        <button id="clear" type="button">Clear</button>
        <span class="k">Error</span>
        <span class="v" id="saved-error"></span>
      </section>
      <button id="enter" type="button" disabled>Calibrate</button>
    </div>
    <script type="module" src="/src/calibrate/main.ts"></script>
  </body>
</html>
