name: ci

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint (biome) + typecheck (all packages) + tests (protocol, headset, server)
      - run: pnpm check

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The lerobot extra pulls in torch; its tests skip cleanly without it.
      - run: uv sync --extra viz
      - run: uv run ruff check src tests
      - run: uv run pytest -q
