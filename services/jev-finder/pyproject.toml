# Set up with uv (README.md): `uv sync`, then `uv run python -m jev_finder.setup_models`.

[project]
name = "jev-finder"
version = "0.1.0"
description = "Clio's object finder: jev boxes refined by EdgeTAM or SAM 2.1 into outlines"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28",
  "pillow>=11",
  "python-dotenv>=1",
  "numpy>=1.26",
  "scipy>=1.15",
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers==5.20.2",
  # EdgeTAM's own dependencies; its repository is fetched into models/, not installed.
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "iopath==0.1.10",
  "timm==1.0.15",
  "einops==0.8.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["jev_finder"]
